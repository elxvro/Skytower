name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SKYTOWER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/skytower-release.jks"
            echo "SKYTOWER_KEYSTORE_PATH=$RUNNER_TEMP/skytower-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test, lint and build
        env:
          SKYTOWER_KEYSTORE_PASSWORD: ${{ secrets.SKYTOWER_KEYSTORE_PASSWORD }}
          SKYTOWER_KEY_ALIAS: ${{ secrets.SKYTOWER_KEY_ALIAS }}
          SKYTOWER_KEY_PASSWORD: ${{ secrets.SKYTOWER_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SkyTower-debug.apk
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -n "${SKYTOWER_KEYSTORE_PATH:-}" ]; then
            cp "$RELEASE_APK" artifacts/SkyTower-release.apk
            cp app/build/outputs/bundle/release/app-release.aab artifacts/SkyTower-release.aab
          else
            cp "$RELEASE_APK" artifacts/SkyTower-release-unsigned.apk
            cp app/build/outputs/bundle/release/app-release.aab artifacts/SkyTower-release-unsigned.aab
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyTower-Android
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
